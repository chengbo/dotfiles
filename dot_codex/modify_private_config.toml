#!/bin/sh
set -e

cat <<'STATIC'
approval_policy        = "on-request"
sandbox_mode           = "workspace-write"
model_reasoning_effort = "high"
approvals_reviewer = "auto_review"

[mcp_servers.ado]
command = "npx"
args = ["-y", "@azure-devops/mcp", "absinc", "--authentication", "azcli"]

[mcp_servers.ado.tools.wit_work_item]
approval_mode = "approve"

STATIC

# Preserve any [projects."..."] trust entries already in the live file —
# these are machine-local (Codex CLI writes them per project path) and
# must not be hardcoded into the dotfiles source.
awk '/^\[projects\./{p=1} p'
